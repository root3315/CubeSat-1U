[tool:pytest]
testpaths = tests/
python_files = test_*.py *_test.py simple_test_suite.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --asyncio-mode=auto

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    serial: marks tests that require serial communication
    hardware: marks tests that require hardware (deselect with '-m "not hardware"')
    security: marks security-related tests
    performance: marks performance/load tests
    integration: marks integration tests